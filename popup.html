<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Price Breakdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icon128.png" class="header-logo" alt="Booking Breakdown logo" width="24" height="24">
    <h1>Booking Breakdown</h1>
  </div>
  <div class="language-select">
    <label class="language-label" for="languageSelect" data-i18n="langLabel"></label>
    <select id="languageSelect" aria-label="Language">
      <option value="auto" data-i18n="langAuto"></option>
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </div>
  <p class="description" data-i18n="popupDescription"></p>
  <p class="order-hint" data-i18n="popupOrderHint"></p>
  <div class="option-list" id="optionList">
    <div class="option-item" data-key="showTotal">
      <span class="drag-handle" data-i18n-aria="ariaDrag" title="⋮⋮" tabindex="0">
      <svg class="drag-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/>
        <circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/>
        <circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/>
      </svg>
    </span>
      <span class="option-label" data-i18n="optionTotal"></span>
      <label class="switch" data-i18n-aria="ariaTotal">
        <input type="checkbox" id="showTotal">
        <span class="slider"></span>
      </label>
    </div>
    <div class="option-item" data-key="showPerPerson">
      <span class="drag-handle" data-i18n-aria="ariaDrag" title="⋮⋮" tabindex="0">
      <svg class="drag-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/>
        <circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/>
        <circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/>
      </svg>
    </span>
      <span class="option-label" data-i18n="optionPerPerson"></span>
      <label class="switch" data-i18n-aria="ariaPerPerson">
        <input type="checkbox" id="showPerPerson">
        <span class="slider"></span>
      </label>
    </div>
    <div class="option-item" data-key="showPerNight">
      <span class="drag-handle" data-i18n-aria="ariaDrag" title="⋮⋮" tabindex="0">
      <svg class="drag-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/>
        <circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/>
        <circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/>
      </svg>
    </span>
      <span class="option-label" data-i18n="optionPerNight"></span>
      <label class="switch" data-i18n-aria="ariaPerNight">
        <input type="checkbox" id="showPerNight">
        <span class="slider"></span>
      </label>
    </div>
    <div class="option-item" data-key="showPerNightPerPerson">
      <span class="drag-handle" data-i18n-aria="ariaDrag" title="⋮⋮" tabindex="0">
      <svg class="drag-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/>
        <circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/>
        <circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/>
      </svg>
    </span>
      <span class="option-label" data-i18n="optionPerNightPerPerson"></span>
      <label class="switch" data-i18n-aria="ariaPerNightPerPerson">
        <input type="checkbox" id="showPerNightPerPerson">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <footer class="footer" data-i18n="footerText"></footer>
  <script src="browser-polyfill.min.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>

</body>
</html>
